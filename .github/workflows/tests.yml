name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ubuntu-latest runners have Docker, so the Testcontainers-based
      # real-database test runs here too (it auto-skips where Docker is absent).
      - name: Run tests
        run: npm test
        env:
          NEO4J_TEST_IMAGE: neo4j:2026.07.1-enterprise

  # Deploys GitHub Pages only after the tests pass.
  # Requires Settings -> Pages -> Source to be set to "GitHub Actions"
  # (this replaces the automatic "pages build and deployment" workflow).
  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Same build as the automatic "pages build and deployment" workflow:
      # Jekyll renders README.md into the site's index page.
      - uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - id: deployment
        uses: actions/deploy-pages@v5
