name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ubuntu-latest runners have Docker, so the Testcontainers-based
      # real-database test runs here too (it auto-skips where Docker is absent).
      - name: Run tests
        run: npm test
        env:
          NEO4J_TEST_IMAGE: neo4j:2026.07.1-enterprise
